---

<h3 style="color: dodgerblue;">Functional representation of motion (1D point)</h3>

<p style="text-align: center;"><span>
\(s(t)\)&emsp; yields a distance for any t.</span> &ensp;
<span style="color: red;font-size:50%;">What form would you infer for the <i>free-fall</i> example?</span>
</p>

A more diverse motion:

<p style="text-align:center;"><img src=/images/1D-graph2.svg style="text-align:center; max-height:300px; margin-bottom:0px;"></p>

<strong>Speed</strong> = rate of change at a particular time intant.<br>
<span style="color: red;font-size:50%;">How much farther would we fall at a given height, if time progresses just a tiny bit `\(\epsilon\)`? <button onclick="https://lti.klicker.uzh.ch?redirectTo=https://pwa.klicker.uzh.ch/course/f172190f-4c31-46da-a526-221572432c2d/liveQuizzes">Live Quiz</button></span>

$$v(t)=\lim_{\epsilon\to 0}\frac{s(t+\epsilon)-s(t)}{\epsilon}$$  

---

<h4 style="color: dodgerblue;">Speed = time derivative of the position</h4>
<span style="color: red;font-size:50%;">In general, a derivative keeps track of a quantity which changes when a parameter (not necessarily time) changes <i>infinitesimally</i>.</span>


<div style="color: gray;text-align: center;margin-top: 30px;font-size: 50%;o">
\(s, u, v, w\): functions of \(t\); <br> \(a, b, c, n\): arbitrary constants
</div>

---

<h4 style="color: dodgerblue;">Acceleration <span style="color:black;font-size:80%;"> = time derivative of the velocity = 2nd time derivative of the position</span> </h4>

$$a(t)=\frac{d}{dt}v(t)=\frac{d}{dt}\frac{d}{dt}s(t)\equiv \frac{d^2}{dt^2}s(t)$$

<hr style="margin-top: 10px;margin-bottom: 10px;" />

As an operation, `\(\frac{d}{dt}\)` has an inverse.&emsp;<span style="color: red;font-size:50%;">Given the speed at some time, where will I be a short increment later?</span>

`\[s(t+\epsilon)=v(t)\cdot\epsilon~\Rightarrow~s(t_f)=\sum_n^N v(t_i+n\epsilon)\epsilon~\to~\int_{t_i}^{t_f}v(t)\,dt\]`

<span style="color: red;font-size:50%;">for the finite difference `\(t_f-t_i=N\epsilon\)` and the integral sign `\(\int\)` representing the infinite sum in the limit `\(\epsilon\to0,~N\to\infty\)` s.t. `\(N\cdot\epsilon~=~\)`constant.</span>

<hr style="margin-top: 10px;margin-bottom: 10px;" />

<p style="color: darkgreen;">Example in 2 dimensions:</p>

- <span style="color:black;font-size:60%;"> `\(x:\)` start from rest at `\(x_0\)` and move with constant speed `\(v\)`&emsp; hence: &emsp; `\(x(t)=x_0+v\cdot t\)`</span>
- <span style="color:black;font-size:60%;"> `\(y:\)` start from rest at `\(y_0\)` and move with constant acceleration `\(g\)`&emsp; hence: &emsp; `\(y(t)=y_0+\frac{a}{2}\cdot t^2\)`</span> &emsp;<span style="color: red;font-size:50%;">(why is this so?)</span>

`\[s\to\vec{s}=\begin{pmatrix}x\\y\end{pmatrix}\qquad\text{and}\qquad\frac{ds}{dt}\to\frac{d}{dt}\vec{s}=\begin{pmatrix}\frac{dx}{dt}\\\frac{dy}{dt}\end{pmatrix}\]`

Parametric graph:

<div><img src="/images/2D-graph.svg"  style="display: block;margin-left: auto;margin-right: auto;"></div>

<div class="center"><strong style="color: red;">Important:</strong> How far does the point travel in a small time interval \(\Delta t\)?</div>

<div class="grid-container">
  <div class="grid-item"><img src="/images/2D-motion.svgz"  style="display: block;margin-right: auto;max-height: 150px;"></div>
  <div class="grid-item" style="font-size: 14px;">\(\Delta t\)&emsp;<i>small</i>&emsp;enough to assume that \(\vec{v}=~\)constant.<br>
We obtain the velocity at \(t\) by taking \(\Delta t\to 0\):
$$\lim_{\Delta t\to 0}\frac{\Delta s}{\Delta t}=\sqrt{\left(\frac{\Delta x}{\Delta t}\right)^2+\left(\frac{\Delta y}{\Delta t}\right)^2}=\sqrt{v_x^2+v_y^2}=\vert\vec{v}\vert$$
