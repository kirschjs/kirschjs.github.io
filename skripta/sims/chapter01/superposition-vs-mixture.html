<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block 2 · Superposition is not ignorance</title>
<style>
  :root { --ink:#1a1a1a; --blue:#1d4ed8; --red:#b91c1c; --grey:#8a8a8a; --line:#d4d4d4; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
         color:var(--ink); background:#fff; padding:18px 22px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 2px; }
  .sub { color:var(--grey); font-size:14px; margin:0 0 14px; }
  canvas { border:1px solid var(--line); border-radius:6px; background:#fff; max-width:100%; }
  .row { display:flex; gap:26px; flex-wrap:wrap; align-items:flex-start; margin-top:14px; }
  .ctrl { display:flex; align-items:center; gap:10px; font-size:16px; margin-bottom:8px; }
  .ctrl label { width:160px; }
  input[type=range] { width:260px; height:34px; }
  .val { width:56px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  button { font-size:15px; padding:10px 15px; border:1px solid var(--line); background:#fafafa;
           border-radius:6px; cursor:pointer; }
  .presets { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .counts { border:1px solid var(--line); border-radius:6px; padding:14px 18px; background:#fffdf2;
            font-size:17px; line-height:1.7; min-width:250px; }
  .big { font-size:27px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tag { font-size:14px; color:var(--grey); }
  .verdict { font-size:17px; margin-top:10px; padding:12px 16px; border-radius:6px;
             background:#f3f6ff; border:1px solid #c9d6ff; max-width:640px; }
</style>
</head>
<body>
<h1>Superposition is not ignorance</h1>
<p class="sub">Block 2 · same 50/50 statistics in one basis, different statistics in another</p>

<canvas id="bench" width="1000" height="380"></canvas>

<div class="row">
  <div>
    <div class="ctrl">
      <label>analyzer angle</label>
      <input type="range" id="an" min="0" max="180" step="1" value="0">
      <span class="val" id="anV"></span>
    </div>
    <div class="ctrl">
      <label>rate</label>
      <input type="range" id="rate" min="1" max="300" step="1" value="10">
      <span class="val" id="rateV"></span>
    </div>
    <div class="presets">
      <button data-a="0">analyze at 0&deg;</button>
      <button data-a="45">analyze at 45&deg;</button>
      <button data-a="90">analyze at 90&deg;</button>
      <button id="reset">reset counts</button>
    </div>
    <div class="verdict" id="verdict"></div>
  </div>
  <div class="counts" id="counts"></div>
</div>

<script>
(function () {
  var cv = document.getElementById('bench'), ctx = cv.getContext('2d');
  var anEl = document.getElementById('an'), rateEl = document.getElementById('rate');
  var LANE = [{ y: 105, name: 'superposition', sub: '|45\u00B0\u27E9 every time' },
              { y: 275, name: 'mixture', sub: 'half |x\u27E9, half |y\u27E9' }];
  var START_X = 150, POL_X = 560, SCREEN_X = 830;
  var ph = [[], []], spots = [[], []], em = [0, 0], det = [0, 0], acc = 0, last = 0;

  function rad(d) { return d * Math.PI / 180; }
  function dir(a) { return { x: Math.sin(rad(a)), y: -Math.cos(rad(a)) }; }

  function emit() {
    for (var L = 0; L < 2; L++) {
      var a = (L === 0) ? 45 : (Math.random() < 0.5 ? 0 : 90);
      ph[L].push({ x: START_X, y: LANE[L].y + (Math.random() - 0.5) * 24, a: a, dead: 0 });
      em[L]++;
    }
  }

  function step(dt) {
    acc += dt * (+rateEl.value);
    while (acc >= 1) { emit(); acc -= 1; }
    var v = 300 + (+rateEl.value) * 1.1, A = +anEl.value;
    for (var L = 0; L < 2; L++) {
      for (var i = ph[L].length - 1; i >= 0; i--) {
        var p = ph[L][i];
        if (p.dead) { p.dead -= dt; if (p.dead <= 0) ph[L].splice(i, 1); continue; }
        var xn = p.x + v * dt;
        if (p.x < POL_X && xn >= POL_X) {
          var c = Math.cos(rad(p.a - A));
          if (Math.random() < c * c) { p.a = A; p.x = xn; }
          else { p.x = POL_X; p.dead = 0.28; continue; }
        } else p.x = xn;
        if (p.x >= SCREEN_X) {
          det[L]++;
          spots[L].push({ x: SCREEN_X + 8 + Math.random() * 24, y: p.y + (Math.random() - 0.5) * 26 });
          if (spots[L].length > 500) spots[L].shift();
          ph[L].splice(i, 1);
        }
      }
    }
  }

  function drawLane(L) {
    var y = LANE[L].y, A = +anEl.value, d = dir(A);
    ctx.fillStyle = '#333'; ctx.font = '16px Georgia, serif';
    ctx.fillText(LANE[L].name, 20, y - 12);
    ctx.fillStyle = '#8a8a8a'; ctx.font = '14px Georgia, serif';
    ctx.fillText(LANE[L].sub, 20, y + 10);
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1.3;
    ctx.strokeRect(START_X - 46, y - 30, 40, 60);
    ctx.strokeStyle = '#e2e2e2'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(START_X, y); ctx.lineTo(SCREEN_X, y); ctx.stroke();
    // analyzer
    ctx.save();
    ctx.beginPath(); ctx.rect(POL_X - 16, y - 58, 32, 116); ctx.clip();
    ctx.fillStyle = '#f4f4f4'; ctx.fillRect(POL_X - 16, y - 58, 32, 116);
    ctx.strokeStyle = '#9a9a9a'; ctx.lineWidth = 1.3;
    for (var s = -130; s < 130; s += 11) {
      ctx.beginPath();
      ctx.moveTo(POL_X - d.x * 85, y + s - d.y * 85);
      ctx.lineTo(POL_X + d.x * 85, y + s + d.y * 85);
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1.2;
    ctx.strokeRect(POL_X - 16, y - 58, 32, 116);
    ctx.strokeStyle = '#1d4ed8'; ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(POL_X - d.x * 42, y - d.y * 42);
    ctx.lineTo(POL_X + d.x * 42, y + d.y * 42);
    ctx.stroke();
    // screen
    ctx.fillStyle = '#fafafa'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1.3;
    ctx.fillRect(SCREEN_X, y - 62, 42, 124);
    ctx.strokeRect(SCREEN_X, y - 62, 42, 124);
    spots[L].forEach(function (sp) {
      ctx.globalAlpha = 0.65; ctx.fillStyle = '#b91c1c';
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 2.6, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ph[L].forEach(function (p) {
      if (p.dead) {
        ctx.globalAlpha = Math.max(p.dead / 0.28, 0);
        ctx.strokeStyle = '#b91c1c'; ctx.lineWidth = 2;
        for (var k = 0; k < 6; k++) {
          var an = k * Math.PI / 3;
          ctx.beginPath();
          ctx.moveTo(p.x + Math.cos(an) * 5, p.y + Math.sin(an) * 5);
          ctx.lineTo(p.x + Math.cos(an) * 12, p.y + Math.sin(an) * 12);
          ctx.stroke();
        }
        ctx.globalAlpha = 1; return;
      }
      var pd = dir(p.a);
      ctx.fillStyle = '#1d4ed8';
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill();
      ctx.strokeStyle = '#1d4ed8'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x - pd.x * 10, p.y - pd.y * 10);
      ctx.lineTo(p.x + pd.x * 10, p.y + pd.y * 10);
      ctx.stroke();
    });
  }

  function theory() {
    var A = +anEl.value;
    var c = Math.cos(rad(45 - A));
    var sup = c * c;
    var c0 = Math.cos(rad(0 - A)), c9 = Math.cos(rad(90 - A));
    var mix = 0.5 * c0 * c0 + 0.5 * c9 * c9;
    return [sup, mix];
  }

  function counts() {
    var th = theory();
    var html = '';
    for (var L = 0; L < 2; L++) {
      var f = em[L] ? det[L] / em[L] : 0;
      html += '<span class="tag">' + LANE[L].name + '</span><br><span class="big">' +
        (f * 100).toFixed(1) + ' %</span> <span class="tag">measured &nbsp;·&nbsp; ' +
        (th[L] * 100).toFixed(1) + ' % predicted</span><br><span class="tag">' +
        det[L] + ' of ' + em[L] + '</span><br><br>';
    }
    document.getElementById('counts').innerHTML = html;
    var gap = Math.abs(th[0] - th[1]);
    document.getElementById('verdict').innerHTML = gap < 0.02
      ? 'At this angle the two beams are statistically identical. No measurement in this basis can tell them apart.'
      : 'At this angle the beams differ by ' + (gap * 100).toFixed(0) +
        ' percentage points. The question posed in this basis has an answer for the superposition that it does not have for the mixture.';
  }

  function frame(now) {
    var dt = last ? Math.min((now - last) / 1000, 0.05) : 0; last = now;
    step(dt);
    ctx.clearRect(0, 0, cv.width, cv.height);
    drawLane(0); drawLane(1);
    counts();
    requestAnimationFrame(frame);
  }

  function reset() { ph = [[], []]; spots = [[], []]; em = [0, 0]; det = [0, 0]; }
  function sync() {
    document.getElementById('anV').textContent = anEl.value + '\u00B0';
    document.getElementById('rateV').textContent = rateEl.value + '/s';
  }
  [anEl, rateEl].forEach(function (e) { e.addEventListener('input', function () { sync(); reset(); }); });
  Array.prototype.forEach.call(document.querySelectorAll('.presets button[data-a]'), function (b) {
    b.addEventListener('click', function () { anEl.value = b.getAttribute('data-a'); sync(); reset(); });
  });
  document.getElementById('reset').addEventListener('click', reset);

  sync();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
