---
layout: default
---
<style>
/* context header (\begin{abstract} in the source), unlabeled: narrower measure, smaller type,
   set off from the problem statement by the same rule as the solutions line below */
.abstract { margin: 0 3em 1.5em 3em; font-size: 0.92em; text-align: justify; hyphens: auto; }
.abstract p { margin: 0 0 0.5em 0; padding: 0; }
.abstract p + p { text-indent: 1.5em; }
.abstract p:last-child { margin-bottom: 0; }
.abstract + * { margin-top: 0; padding-top: 0.75em; border-top: solid 1px #B8B8B8; }
@media (max-width: 600px) { .abstract { margin-left: 1em; margin-right: 1em; } }
</style>
<article>
  {{ content }}

  {%- if page.status == "awarded" and page.solver %}
  <p style="margin-top:2em; color:#888;">Awarded to {{ page.solver }}
    {%- if page.solution_url and page.solution_url != "" %} &middot; <a href="{{ page.solution_url }}">solution</a>{%- endif -%}.</p>
  {%- endif %}

  <p style="margin-top:2.5em; padding-top:0.75em; border-top: solid 1px #B8B8B8; font-size:medium; color:#B8B8B8;">
    solutions &rarr; <a href="mailto:{{ site.email }}?subject={{ page.title | url_encode }}">{{ site.email }}</a>
  </p>
</article>
