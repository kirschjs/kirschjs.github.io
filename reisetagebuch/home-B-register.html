<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout B – Karte &amp; Register</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4ECDA; --paper2:#EADFC6; --line:#CDBB95; --terracotta:#9A4520;
    --navy:#21384B; --navy-light:#3C5C74; --gold:#B98A33; --dark:#1d2630; --land:#CFE0DC;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--dark);font-family:'Crimson Text',Georgia,serif}
  .back{position:fixed;top:12px;left:14px;z-index:9;background:rgba(255,255,255,.85);
    border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:13px;text-decoration:none;color:var(--navy)}

  .masthead{background:var(--navy);color:#fff;padding:30px 40px;border-bottom:4px solid var(--gold)}
  .masthead .kick{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
  .masthead h1{font-family:'Playfair Display',serif;font-size:clamp(26px,4vw,44px);margin-top:6px}
  .masthead h1 em{color:var(--gold);font-style:italic}

  .split{display:grid;grid-template-columns:1.15fr 1fr;gap:0;align-items:stretch}
  @media(max-width:880px){.split{grid-template-columns:1fr}}

  .map-col{background:var(--paper2);padding:30px;position:sticky;top:0;height:100vh;
    display:flex;align-items:center;justify-content:center}
  @media(max-width:880px){.map-col{position:static;height:auto}}
  svg.map{width:100%;height:auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.12))}
  .land{fill:var(--land);stroke:#A9C4BE;stroke-width:.6;stroke-linejoin:round}
  .pin-dot{fill:var(--terracotta);stroke:#fff;stroke-width:2;transition:r .25s,fill .25s}
  .pin-ring{fill:none;stroke:var(--terracotta);stroke-width:1.5;opacity:0;transition:opacity .25s}
  .pin-num{font-family:'Playfair Display',serif;font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none}
  .pin-g.hot .pin-dot{r:14;fill:var(--navy)}
  .pin-g.hot .pin-ring{opacity:.5}

  .list-col{padding:28px 34px 60px}
  .list-col .lead{font-size:18px;font-style:italic;color:#5b5446;line-height:1.5;
    padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:8px}

  .row{display:flex;gap:18px;padding:22px 6px;border-bottom:1px solid var(--line);
    text-decoration:none;color:inherit;transition:background .2s}
  .row:hover{background:rgba(185,138,51,.10)}
  .row .idx{font-family:'Playfair Display',serif;font-size:34px;color:var(--gold);line-height:1;min-width:46px}
  .row h3{font-family:'Playfair Display',serif;font-size:22px;line-height:1.1}
  .row .reg{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--terracotta);margin:3px 0 8px}
  .row p{font-size:15.5px;line-height:1.5;color:#5c5547}
  .row .go{display:inline-block;margin-top:9px;font-weight:600;color:var(--navy)}
  .row:hover .go{color:var(--terracotta)}
</style>
</head>
<body>
<a class="back" href="home-index.html">← Übersicht</a>

<div class="masthead">
  <div class="kick">Reise · Kultur · Küche</div>
  <h1>Kulinarisch-kulturelle <em>reiseN</em></h1>
</div>

<div class="split">
  <div class="map-col">
    <svg class="map" viewBox="0 0 1000 500" id="map" aria-label="Weltkarte mit Reisezielen"></svg>
  </div>
  <div class="list-col">
    <p class="lead">Ein Reiseregister in fünf Kapiteln. Fahren Sie über einen Eintrag, um das Ziel auf der Karte zu finden.</p>
    <div id="rows"></div>
  </div>
</div>

<script src="assets/world.js"></script>
<script>
  const order=Object.values(DESTINATIONS).sort((a,b)=>a.order-b.order);
  const ns="http://www.w3.org/2000/svg";
  const map=document.getElementById('map');
  const land=document.createElementNS(ns,'path');
  land.setAttribute('d',WORLD_PATH);land.setAttribute('class','land');map.appendChild(land);

  order.forEach(d=>{
    const g=document.createElementNS(ns,'a');
    g.setAttribute('href',`reise-${d.slug}.html`);
    g.setAttribute('class','pin-g');g.dataset.slug=d.slug;
    const ring=document.createElementNS(ns,'circle');
    ring.setAttribute('cx',d.x);ring.setAttribute('cy',d.y);ring.setAttribute('r',20);ring.setAttribute('class','pin-ring');
    const dot=document.createElementNS(ns,'circle');
    dot.setAttribute('cx',d.x);dot.setAttribute('cy',d.y);dot.setAttribute('r',11);dot.setAttribute('class','pin-dot');
    const num=document.createElementNS(ns,'text');
    num.setAttribute('x',d.x);num.setAttribute('y',d.y+4);num.setAttribute('class','pin-num');num.textContent=d.order;
    g.append(ring,dot,num);map.appendChild(g);
  });

  const rows=document.getElementById('rows');
  order.forEach(d=>{
    const a=document.createElement('a');a.href=`reise-${d.slug}.html`;a.className='row';a.dataset.slug=d.slug;
    a.innerHTML=`<div class="idx">${d.order}</div>
      <div><h3>${d.name}</h3><div class="reg">${d.country}</div>
      <p>${d.desc}</p><span class="go">Zu den Beiträgen →</span></div>`;
    rows.appendChild(a);
  });

  const sync=(slug,on)=>document.querySelectorAll(`.pin-g[data-slug="${slug}"]`).forEach(e=>e.classList.toggle('hot',on));
  document.querySelectorAll('.row').forEach(r=>{
    r.addEventListener('mouseenter',()=>sync(r.dataset.slug,true));
    r.addEventListener('mouseleave',()=>sync(r.dataset.slug,false));
  });
</script>
<script src="assets/feedback.js"></script>
</body>
</html>
