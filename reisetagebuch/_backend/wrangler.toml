# Cloudflare Worker für die Leserkommentare des Reisetagebuchs.
# Deployen: siehe README.md in diesem Ordner.

name = "reisetagebuch-kommentare"
main = "comments-worker.js"
compatibility_date = "2026-08-01"

# Der KV-Namespace wird einmal angelegt (siehe README) und seine ID hier
# eingetragen. Ohne gültige ID schlägt `wrangler deploy` fehl.
[[kv_namespaces]]
binding = "KOMMENTARE"
id = "24e3ac07ef964ad78f64753b65f15e9f"

# ADMIN_TOKEN wird NICHT hier abgelegt, sondern als Secret gesetzt:
#   wrangler secret put ADMIN_TOKEN
